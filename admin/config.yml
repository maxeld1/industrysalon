backend:
  name: git-gateway
  branch: master

local_backend: true

site_url: https://industrysalonlounge.com
display_url: https://industrysalonlounge.com
logo_url: /assets/images/industry_salon_logo.png

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "Global Settings"
        file: "content/site.json"
        format: "json"
        fields:
          - { label: "Booking URL", name: "bookingUrl", widget: "string" }
          - { label: "Gift Card URL", name: "giftCardUrl", widget: "string" }
          - { label: "Phone Display", name: "phoneDisplay", widget: "string" }
          - { label: "Phone Link", name: "phoneHref", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Address", name: "address", widget: "string" }
          - { label: "Instagram Handle", name: "instagramHandle", widget: "string" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
          - label: "Hours"
            name: "hours"
            widget: "list"
            summary: "{{fields.day}}: {{fields.time}}"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Time", name: "time", widget: "string" }

  - name: "services"
    label: "Services"
    files:
      - name: "services"
        label: "Services & Pricing"
        file: "content/services.json"
        format: "json"
        fields:
          - { label: "Page Intro", name: "intro", widget: "text" }
          - { label: "Pricing Note", name: "pricingNote", widget: "text" }
          - label: "Service Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Category Title", name: "title", widget: "string" }
              - { label: "Show on Homepage", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Note", name: "note", widget: "text", required: false }
              - label: "Services"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} - {{fields.price}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Price", name: "price", widget: "string" }

  - name: "stylists"
    label: "Stylists"
    files:
      - name: "stylists"
        label: "Stylist Profiles"
        file: "content/stylists.json"
        format: "json"
        fields:
          - { label: "Page Intro", name: "intro", widget: "text" }
          - label: "Team Members"
            name: "members"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Level", name: "level", widget: "number", value_type: "int", required: false }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Headshot", name: "image", widget: "image", required: false }
              - { label: "Image Alt Text", name: "imageAlt", widget: "string", required: false }
              - { label: "Instagram Handle", name: "instagramHandle", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string", required: false }
              - label: "Bio Paragraphs"
                name: "bio"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
